[package]
name = "stick-up-notes"
version = "1.0.0"
description = "Stick Up Notes - Aesthetic offline-first sticky-note board with native floating overlays"
authors = ["nihilanthrope"]
edition = "2021"

[lib]
name = "stick_up_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
